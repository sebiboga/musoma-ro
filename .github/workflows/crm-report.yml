name: CRM S\u0103pt\u0103m\u00e2nal

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Extrage \u0219i trimite raport CRM
        env:
          SUPABASE_URL: https://nxgkfyimpkxmqkkoavms.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          SINCE=$(date -u -d "7 days ago" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v-7d +"%Y-%m-%dT%H:%M:%SZ")

          DATA=$(curl -s "$SUPABASE_URL/rest/v1/crm_view?created_at=gte.$SINCE&order=created_at.desc" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Accept: application/json")

          COUNT=$(echo "$DATA" | jq 'length')
          echo "Intrari noi: $COUNT"

          if [ "$COUNT" = "0" ]; then
            echo "Nicio activitate noua saptamana aceasta."
            exit 0
          fi

          ROWS=$(echo "$DATA" | jq -r '.[] | "<tr><td>\(.ref_id // "")</td><td>\(.nume // "")</td><td>\(.email // "")</td><td>\(.tip // "")</td><td>\(.continut // "")</td><td>\(.created_at[0:19] | gsub("T"; " "))</td></tr>"')
          HTML="<h2>Raport săptămânal CRM</h2><p>Perioada: ultimele 7 zile</p><table border=\"1\" cellpadding=\"6\" cellspacing=\"0\" style=\"border-collapse:collapse;font-family:sans-serif;\"><thead><tr style=\"background:#1a3c34;color:#fff;\"><th>Ref</th><th>Nume</th><th>Email</th><th>Tip</th><th>Detalii</th><th>Data</th></tr></thead><tbody>$ROWS</tbody></table><p style=\"color:#666;font-size:0.85em;\">Acesta este un raport automat generat de Musoma PROD SRL.</p>"

          curl -s "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg html "$HTML" '{
              from: "contact@musoma.ro",
              to: "sebitestb@gmail.com",
              subject: "Raport CRM - Musoma PROD (test)",
              html: $html
            }')"
